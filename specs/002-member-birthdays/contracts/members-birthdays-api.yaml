openapi: 3.1.0
info:
  title: GD Manager - Members Birthdays API
  version: 2.0.0
  description: Contrato OpenAPI para gestão e consulta de aniversários de membros no GD Manager.
servers:
  - url: http://localhost:8000/api/v1
    description: Servidor de desenvolvimento local

paths:
  /members:
    post:
      summary: Cadastrar novo membro com data de nascimento obrigatória
      operationId: createMember
      parameters:
        - name: X-User-Role
          in: header
          required: false
          schema:
            type: string
            enum: [leader, core, normal]
            default: leader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Membro criado com sucesso com data de nascimento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          description: Dados inválidos (ex. data de nascimento futura ou anterior a 1900).
        '403':
          description: Acesso negado para perfil sem permissão de escrita.
        '409':
          description: Conflito de telefone já cadastrado.

    get:
      summary: Listar membros com suporte a filtro por mês de aniversário
      operationId: listMembers
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive]
            default: active
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [leader, core, normal]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: birthday_month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Filtrar membros cujo aniversário ocorre no mês especificado (1=Janeiro a 12=Dezembro).
        - name: X-User-Role
          in: header
          required: false
          schema:
            type: string
            enum: [leader, core, normal]
            default: normal
      responses:
        '200':
          description: Lista de membros retornada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'

  /members/birthdays/upcoming:
    get:
      summary: Listar membros que fazem aniversário nos próximos dias
      operationId: listUpcomingBirthdays
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
          description: Janela de dias para projeção dos aniversários (padrão 30 dias).
        - name: X-User-Role
          in: header
          required: false
          schema:
            type: string
            enum: [leader, core, normal]
            default: normal
      responses:
        '200':
          description: Lista de aniversariantes próximos ordenada cronologicamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'

  /members/{id}:
    put:
      summary: Atualizar membro com data de nascimento obrigatória
      operationId: updateMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-User-Role
          in: header
          required: false
          schema:
            type: string
            enum: [leader, core, normal]
            default: leader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Membro atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          description: Dados inválidos (ex. data de nascimento ausente ou futura).
        '404':
          description: Membro não encontrado.

components:
  schemas:
    CreateMemberRequest:
      type: object
      required:
        - name
        - phone
        - role
        - birth_date
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: Carlos Eduardo
        phone:
          type: string
          example: "11987654321"
        email:
          type: string
          format: email
          nullable: true
          example: carlos@exemplo.com
        role:
          type: string
          enum: [leader, core, normal]
          default: normal
        birth_date:
          type: string
          example: "15/05/1992"
          description: Data de nascimento obrigatória. Aceita o padrão brasileiro DD/MM/AAAA ou ISO YYYY-MM-DD. Não pode ser data futura.

    UpdateMemberRequest:
      type: object
      required:
        - name
        - phone
        - role
        - birth_date
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: Carlos Eduardo da Silva
        phone:
          type: string
          example: "11987654321"
        email:
          type: string
          format: email
          nullable: true
          example: carlos.silva@exemplo.com
        role:
          type: string
          enum: [leader, core, normal]
        birth_date:
          type: string
          example: "15/05/1992"
          description: Data de nascimento obrigatória. Aceita o padrão brasileiro DD/MM/AAAA ou ISO YYYY-MM-DD.

    MemberResponse:
      type: object
      required:
        - id
        - name
        - phone
        - role
        - status
        - initials
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [leader, core, normal]
        status:
          type: string
          enum: [active, inactive]
        birth_date:
          type: string
          format: date
          nullable: true
          example: "1992-05-15"
        birth_date_formatted:
          type: string
          nullable: true
          example: "15/05/1992"
          description: Data de nascimento formatada no padrão brasileiro DD/MM/AAAA.
        age:
          type: integer
          nullable: true
          example: 34
          description: Idade atual completada em anos calculada a partir de birth_date.
        birthday_display:
          type: string
          nullable: true
          example: "15 de Maio"
          description: Formatação amigável de dia e mês para exibição nos cards.
        is_birthday_today:
          type: boolean
          default: false
          description: Indica se o dia atual coincide com o aniversário do membro.
        days_until_birthday:
          type: integer
          nullable: true
          example: 10
          description: Quantidade de dias até o próximo aniversário.
        initials:
          type: string
          example: "CE"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
